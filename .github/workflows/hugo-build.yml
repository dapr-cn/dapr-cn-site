name: Build Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and check
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm (version from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Run checks
        run: pnpm run verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-build-${{ github.sha }}
          path: dist/
          retention-days: 7
