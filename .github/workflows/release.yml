name: Site CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    timeout-minutes: 30
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm (version from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Run checks
        run: pnpm run verify

      - name: Calculate dist folder size
        run: |
          SIZE=$(du -sh dist | cut -f1)
          SIZE_BYTES=$(du -sb dist | cut -f1)
          echo "::notice title=Build Size::Dist folder size: $SIZE ($SIZE_BYTES bytes)"
          echo "DIST_FOLDER_SIZE=$SIZE" >> $GITHUB_ENV
          echo "DIST_FOLDER_SIZE_BYTES=$SIZE_BYTES" >> $GITHUB_ENV

      - name: Comment build size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const size = process.env.DIST_FOLDER_SIZE;
            const sizeBytes = process.env.DIST_FOLDER_SIZE_BYTES;
            const comment = `## 📦 Site Build Size Report

            The built site size: **${size}** (${parseInt(sizeBytes).toLocaleString()} bytes)

            > Generated for commit ${context.sha.substring(0, 7)}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/dist" # Astro 构建输出目录
          api_location: "" # 无 API
          output_location: "" # 已经是构建输出
          skip_app_build: true # 跳过 Azure 的构建，使用上一步的 Astro 构建
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
